name: Публикация на GitHub Pages

# Перед первым запуском: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          # новая версия кеша на каждую публикацию, чтобы телефоны получили обновление
          sed -i "s/const CACHE = 'vector-v1'/const CACHE = 'vector-${GITHUB_SHA::8}'/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
